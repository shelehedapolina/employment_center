services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employment_center}
      POSTGRES_USER: ${POSTGRES_USER:-ec_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ec_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infrastructure/postgres/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ec_admin} -d ${POSTGRES_DB:-employment_center}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-ec_admin}:${POSTGRES_PASSWORD:-ec_pass}@db:5432/${POSTGRES_DB:-employment_center}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
